seed: 42
num_steps_per_env: 24
max_iterations: 10000
obs_groups:
  actor: !!python/tuple
  - actor
  critic: !!python/tuple
  - critic
save_interval: 1000
experiment_name: g23_velocity_proprio_history6
run_name: stair_goals_v2
logger: wandb
wandb_project: mjlab
wandb_tags: !!python/tuple []
resume: true
load_run: \A2026\-10\-16_09\-25\-04\Z
load_checkpoint: \Amodel_62000\.pt\Z
clip_actions: 5.0
upload_model: false
class_name: OnPolicyRunner
actor:
  hidden_dims: !!python/tuple
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: true
  cnn_cfg: null
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 1.0
    std_type: scalar
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: MLPModel
critic:
  hidden_dims: !!python/tuple
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: true
  cnn_cfg: null
  distribution_cfg: null
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: MLPModel
algorithm:
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.003
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  optimizer: adam
  share_cnn_encoders: false
  symmetry_cfg:
    data_augmentation_func: mjlab.tasks.velocity.config.g23.symmetry:mirror_g23_velocity
    use_data_augmentation: true
    use_mirror_loss: false
    mirror_loss_coeff: 0.0
  class_name: PPO
