commands:
  twist:
    resampling_time_range: !!python/tuple
    - 3.0
    - 8.0
    debug_vis: true
    entity_name: robot
    heading_command: true
    heading_control_stiffness: 0.5
    rel_standing_envs: 0.1
    rel_heading_envs: 0.1
    rel_world_envs: 0.0
    rel_forward_envs: 0.4
    rel_backward_envs: 0.1
    init_velocity_prob: 0.0
    sample_single_axis_commands: false
    ranges:
      lin_vel_x: !!python/tuple
      - -1.0
      - 1.0
      lin_vel_y: !!python/tuple
      - -0.2
      - 0.2
      ang_vel_z: !!python/tuple
      - -0.5
      - 0.5
      heading: !!python/tuple
      - -3.141592653589793
      - 3.141592653589793
    viz:
      z_offset: 0.45
      scale: 0.5
curriculum:
  command_performance:
    func: !!python/name:mjlab.tasks.velocity.mdp.curriculums.PerformanceGatedVelocityCurriculum ''
    params:
      command_name: twist
      stages:
      - min_terrain_level: 0
        lin_vel_x: !!python/tuple
        - -1.0
        - 1.0
        lin_vel_y: !!python/tuple
        - -0.2
        - 0.2
        ang_vel_z: !!python/tuple
        - -0.5
        - 0.5
        rel_forward_envs: 0.4
        rel_backward_envs: 0.1
      - min_terrain_level: 3
        lin_vel_x: !!python/tuple
        - -1.0
        - 1.0
        lin_vel_y: !!python/tuple
        - -0.2
        - 0.2
        ang_vel_z: !!python/tuple
        - -0.5
        - 0.5
        rel_forward_envs: 0.4
        rel_backward_envs: 0.2
      - min_terrain_level: 5
        lin_vel_x: !!python/tuple
        - -1.25
        - 1.25
        lin_vel_y: !!python/tuple
        - -0.4
        - 0.4
        ang_vel_z: !!python/tuple
        - -0.7
        - 0.7
        rel_forward_envs: 0.4
        rel_backward_envs: 0.2
      - min_terrain_level: 7
        lin_vel_x: !!python/tuple
        - -1.25
        - 1.25
        lin_vel_y: !!python/tuple
        - -0.4
        - 0.4
        ang_vel_z: !!python/tuple
        - -0.7
        - 0.7
        rel_forward_envs: 0.4
        rel_backward_envs: 0.3
      - min_terrain_level: 9
        lin_vel_x: !!python/tuple
        - -1.5
        - 1.5
        lin_vel_y: !!python/tuple
        - -0.6
        - 0.6
        ang_vel_z: !!python/tuple
        - -0.7
        - 0.7
        rel_forward_envs: 0.4
        rel_backward_envs: 0.3
      terrain_names: !!python/tuple
      - pyramid_stairs
      - pyramid_stairs_inv
      min_episodes_per_terrain: 256
      min_directional_samples_per_terrain: 20000
      min_safe_success_rate: 0.6
      min_directional_tracking_score: 0.6
      warmup_steps: 1000
      min_stage_steps: 12000
